name: Build and Publish PhotoFinder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PhotoFinder/PhotoFinder.csproj

      - name: Build
        run: dotnet build PhotoFinder/PhotoFinder.csproj -c Release --no-restore

      - name: Publish
        run: |
          dotnet publish PhotoFinder/PhotoFinder.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishTrimmed=false `
            -o artifacts

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoFinder-EXE
          path: artifacts/**
