name: Build and publish PhotoFinder on: push: branches: - main
jobs: build: runs-on: windows-latest steps: - name: Checkout uses: actions/checkout@v4
- name: Setup .NET
    uses: actions/setup-dotnet@v3
    with:
      dotnet-version: '7.0.x'

  - name: Restore
    run: dotnet restore PhotoFinder/PhotoFinder.csproj

  - name: Build
    run: dotnet build PhotoFinder/PhotoFinder.csproj -c Release --no-restore

  - name: Publish single-file self-contained exe (win-x64)
    run: |
      dotnet publish PhotoFinder/PhotoFinder.csproj -c Release -r win-x64 /p:PublishSingleFile=true /p:PublishTrimmed=false /p:SelfContained=true -o ${{ github.workspace }}/artifacts

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: PhotoFinder-exe
      path: artifacts/*.exe
